# /etc/nginx/conf.d/cinema.conf  (Web VM)
server {
    listen 80;
    server_name _;
    root /var/www/frontend;

    location / { try_files $uri /index.html; }

    # Trailing slash on proxy_pass strips the prefix: /users/login -> /login
    location /users/    { proxy_pass http://APP_VM_PRIVATE_IP:8081/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /products/ { proxy_pass http://APP_VM_PRIVATE_IP:8082/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /orders/   { proxy_pass http://APP_VM_PRIVATE_IP:8083/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # Internal seat endpoints must never be reachable from the internet
    location ~ ^/products/shows/[0-9]+/(reserve|release)$ { return 403; }
}
